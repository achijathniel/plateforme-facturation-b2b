services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: backend_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - php_vendor:/var/www/html/vendor
    networks:
      - backend_network
    depends_on:
      - db
      - redis

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: backend_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - php_vendor:/var/www/html/vendor
    networks:
      - backend_network
    depends_on:
      - app
      - redis
      - db

  web:
    image: nginx:alpine
    container_name: backend_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend_network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: backend_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_network

  redis:
    image: redis:7-alpine
    container_name: backend_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - backend_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: backend_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - backend_network

  adminer:
    image: adminer:latest
    container_name: backend_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - backend_network
    depends_on:
      - db

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  php_vendor:
    driver: local

networks:
  backend_network:
    driver: bridge
